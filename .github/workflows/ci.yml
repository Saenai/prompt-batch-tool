name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -B -m compileall -q .

      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v

      - name: Verify GUI modules import
        run: python -B -c "import prompt_batch.gui; import prompt_batch.gui_models; print('GUI imports OK')"

      - name: Verify CLI entry point
        run: python -B .\batch_cli.py --help

      - name: Parse PowerShell compatibility wrapper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\run-batch.ps1'),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count) {
            $errors | Format-List
            exit 1
          }

  package-windows:
    name: Windows portable package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install packaging tool
        run: python -m pip install --disable-pip-version-check pyinstaller==6.21.0

      - name: Build portable package
        shell: pwsh
        run: |
          $version = if ('${{ github.ref_type }}' -eq 'tag') {
            '${{ github.ref_name }}'
          } elseif ('${{ github.ref }}' -eq 'refs/heads/main') {
            'continuous'
          } else {
            '${{ github.sha }}'.Substring(0, 7)
          }
          .\packaging\windows\build-release.ps1 -Version $version -OutputDirectory artifacts

      - name: Smoke-test packaged executables
        shell: pwsh
        run: |
          $package = Get-Item .\artifacts\prompt-batch-tool

          & (Join-Path $package.FullName 'PromptBatchCLI.exe') --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Packaged CLI failed: $LASTEXITCODE" }

          $fallback = Join-Path $package.Parent.FullName 'llama-swap\config.yaml'
          New-Item -ItemType Directory -Path (Split-Path $fallback) -Force | Out-Null
          "models:`n  smoke-model:`n    name: Smoke Model" | Set-Content -Encoding UTF8 $fallback
          $gui = Start-Process -FilePath (Join-Path $package.FullName 'PromptBatchGenerator.exe') `
            -ArgumentList @('--config', (Join-Path $package.FullName 'config\app.json'), '--self-test') `
            -WindowStyle Hidden -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "Packaged GUI self-test failed: $($gui.ExitCode)" }

      - name: Upload portable package
        uses: actions/upload-artifact@v7
        with:
          name: PromptBatchGenerator-windows-x64
          path: |
            artifacts/PromptBatchGenerator-*-windows-x64.zip
            artifacts/PromptBatchGenerator-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: PromptBatchGenerator-windows-x64
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/*.zip
          release-assets/*.sha256
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "$GITHUB_REF_NAME"

  continuous-release:
    name: Publish continuous release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: package-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          name: PromptBatchGenerator-windows-x64
          path: release-assets

      - name: Move continuous tag to this commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/continuous" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/continuous" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/continuous' -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Create or update continuous prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<EOF
          Automatically published from the latest successful build of \`main\`.

          Commit: \`$GITHUB_SHA\`
          Workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          This is a rolling prerelease. Use a versioned \`v*\` release when reproducibility matters.
          EOF
          if gh release view continuous --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit continuous --repo "$GITHUB_REPOSITORY" \
              --title 'Continuous build' --prerelease --notes-file release-notes.md
            gh release upload continuous release-assets/*.zip release-assets/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create continuous release-assets/*.zip release-assets/*.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title 'Continuous build' --notes-file release-notes.md
          fi
